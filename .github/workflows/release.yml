name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Zip Files
      run: |
        zip -r module.zip module.json scripts styles templates

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          module.json
          module.zip
